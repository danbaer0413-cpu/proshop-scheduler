name: Mercer Oaks - Supabase health check

on:
  schedule:
    # Four times per day (every six hours), UTC. Scheduled runs may be delayed or skipped.
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-database:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query an existing database table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Set the SUPABASE_URL Actions secret}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Set the SUPABASE_PUBLISHABLE_KEY Actions secret}"
          echo "Checking Mercer Oaks Supabase database..."
          curl --silent --show-error --fail-with-body --retry 2 --retry-delay 4 \
            --connect-timeout 10 --max-time 30 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Accept: application/json" \
            "${SUPABASE_URL%/}/rest/v1/courses?select=id&limit=1" \
            --output /dev/null
          echo "Supabase query succeeded."
